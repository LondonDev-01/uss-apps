# Compose de DEV: solo Postgres. El stack completo de producción
# (api + caddy + frontends estáticos) llega en la Fase F — ver PLAN_V3 §6.2.
services:
  postgres:
    image: postgres:16
    container_name: uss-apps-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-uss_apps}
    ports:
      # Bind a 127.0.0.1: la DB de dev NO debe publicarse en la red local (0.0.0.0)
      - "127.0.0.1:5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
